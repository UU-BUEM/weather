# Conda environment for the weather processing pipeline (standalone).
#
# Create (recommended):
#   conda env create -f infrastructure/env/weather_env.yml
#   conda activate weather_env
#   python -m weather info
#
# Update an existing environment:
#   conda env update -n weather_env -f infrastructure/env/weather_env.yml --prune
#
name: weather_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.14
  # Weather pipeline core (alphabetical)
  - cfgrib
  - conda-build          # provides `conda develop` for editable dev mapping
  - dask
  - eccodes
  - netcdf4
  - numpy
  - pandas
  - pyproj
  - python-dotenv
  - requests             # HTTP downloads (MERRA-2, ERA5-Land)
  - urllib3              # Retry utilities imported directly in common/net.py
  - scipy
  - xarray
  # Optional but recommended
  - pvlib                # solar position (used by from_csv)
  - pyarrow              # fast Parquet I/O
  - cdsapi               # ERA5-Land downloads via Copernicus CDS
  - pytest               # testing framework
  - pytest-cov           # coverage reporting
