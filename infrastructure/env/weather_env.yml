# Conda environment for the weather processing pipeline (standalone).
#
# Create:
#   conda env create -f infrastructure/env/weather_env.yml
#   conda activate weather_env
#   pip install -e . --no-deps        # install weather from repo root
#
# Update an existing environment:
#   conda env update -n weather_env -f infrastructure/env/weather_env.yml --prune
#   pip install -e . --no-deps        # re-run if pyproject.toml changed
#
name: weather_env
channels:
  - conda-forge
  - defaults
dependencies:
  # libblas pinned to the openblas build, not conda-forge's default mkl build. Originally
  # needed because mkl + cupy's bundled CUDA BLAS DLLs (cublas/nvblas) collided on Windows,
  # crashing numpy>=2's blas_fpe_check() self-test on import (Windows fatal exception
  # 0xc06d007f) -- numpy imported fine under mkl in envs without cupy (e.g. occupancy_env,
  # buem_env). cupy itself was removed below (2026-07-30, unused -- no GPU work was actually
  # being done), but openblas is kept: the full weather pytest suite (55 passed / 2 skipped,
  # excluding unrelated eccodes-library gaps) was verified clean on numpy 2.4.4 / pandas
  # 3.0.3 + openblas, so there's no reason to revert to an untested mkl-without-cupy config.
  - libblas=*=*openblas
  - bottleneck>=1.3.*        # fast NaN-aware ops (xarray ffill/rolling); optional but recommended
  - cdsapi>=0.7.*
  - cfgrib>=0.9.*
  - dask>=2024.*
  - eccodes>=2.34.*
  - ecmwf-datastores-client>=0.5.*
  - jupyter # optional
  - matplotlib>=3.10.*
  - netcdf4>=1.6.*
  - numba>=0.65.*            # JIT compiler for Python; used in percentile index calculation
  - numpy>=1.26.*
  - openpyxl>=3.1.*          # .xlsx export (tests/compare_providers.py)
  - pandas>=2.2.*
  - pvlib>=0.11.*
  - pyarrow>=15.*
  - pyproj>=3.6.*
  - python=3.12.*             # Core runtime (pinned for reproducibility)
  - python-dotenv>=1.0.*
  - requests>=2.31.*
  - urllib3>=2.2.*
  - scipy>=1.16.*
  - xarray>=2024.*
  # Optional but recommended
  - lbzip2                  # parallel bzip2 C binary; faster than Python bz2 per file;
  - h5py>=3.11.*            # direct HDF5 chunk copy for NetCDFMerger (weather.common.merge)
  - bottleneck>=1.3.*       # fast NaN-aware ops; xarray .ffill() imports it
  - aria2                   # parallel multi-connection downloader.
  - cdo>=2.2.*              # NetCDF bbox cropping (weather.geo.crop / `weather geo crop`)

  # Dev / test tools
  - pytest>=8.*
  - pytest-cov>=5.*
  - pip
  - pip:
    - ruff>=0.6               # linter (dev tool)
    - mypy>=1.8               # type checker
    - types-requests          # type stubs for requests
