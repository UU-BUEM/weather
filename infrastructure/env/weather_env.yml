# Conda environment for the weather processing pipeline (standalone).
#
# Create:
#   conda env create -f infrastructure/env/weather_env.yml
#   conda activate weather_env
#   pip install -e . --no-deps        # install weather from repo root
#
# Update an existing environment:
#   conda env update -n weather_env -f infrastructure/env/weather_env.yml --prune
#   pip install -e . --no-deps        # re-run if pyproject.toml changed
#
name: weather_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Core runtime (pinned for reproducibility)
  - cfgrib=0.9.*
  - dask=2024.*
  - eccodes=2.34.*
  - netcdf4=1.6.*
  - numpy=1.26.*
  - pandas=2.2.*
  - pyproj=3.6.*
  - python-dotenv=1.0.*
  - requests=2.31.*
  - urllib3=2.2.*
  - scipy=1.13.*
  - xarray=2024.*
  # Optional but recommended
  - pvlib=0.11.*
  - pyarrow=15.*
  - cdsapi=0.7.*
  # Dev / test tools
  - pytest=8.*
  - pytest-cov=5.*
  - pip
  - pip:
    - ruff>=0.6               # linter (dev tool)
    - mypy>=1.8               # type checker
    - types-requests          # type stubs for requests
