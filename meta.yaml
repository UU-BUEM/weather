package:
  name: weather
  version: "0.1.0"

source:
  path: .

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - python >=3.14
    - pip
    - setuptools >=68
    - setuptools-scm >=8
  run:
    - python >=3.14
    - cfgrib
    - cdsapi
    - dask
    - eccodes
    - netcdf4
    - numpy
    - pandas
    - pyarrow
    - pvlib
    - pyproj
    - python-dotenv
    - requests
    - scipy
    - urllib3
    - xarray

test:
  imports:
    - weather
  commands:
    - python -m weather info

about:
  summary: Provider-based weather data processing pipeline.
  home: https://github.com/UU-BUEM/weather
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - SomadSahoo
