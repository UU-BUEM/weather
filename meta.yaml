{% set version = environ.get("GIT_DESCRIBE_TAG", "1.1.0").lstrip("v") %}
package:
  name: weather
  version: "{{ version }}"

source:
  path: .

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools >=68
    - setuptools-scm >=8
  run:
    - python >=3.12
    - cfgrib >=0.9.10
    - dask >=2024.1
    - eccodes >=2.34
    - netcdf4 >=1.6
    - numpy >=1.26
    - pandas >=2.0
    - pyproj >=3.6
    - python-dotenv >=1.0
    - requests >=2.31
    - scipy >=1.12
    - urllib3 >=2.0
    - xarray >=2024.1
    - h5py >=3.11       # optional: required for weather.common.merge (NetCDFMerger)

test:
  imports:
    - weather
    - weather.providers
  commands:
    - python -m weather info

about:
  summary: Provider-based weather data processing pipeline.
  home: https://github.com/UU-BUEM/weather
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - SomadSahoo
