version: "3.8"

services:
  weather-dev:
    build:
      context: .
      dockerfile: infrastructure/container/Dockerfile
      target: development
    image: weather:dev
    container_name: weather-dev
    volumes:
      - ./src:/app/src
      - ./data:/data
      - ./scripts:/app/scripts
    environment:
      PYTHONPATH: /app/src
      WEATHER_DATA_DIR: /data
      COSMO_WORK_DIR: /data/cosmo_rea6
      HDF5_USE_FILE_LOCKING: "FALSE"
    working_dir: /app
    command: python -m weather info
    stdin_open: true
    tty: true

  weather-prod:
    build:
      context: .
      dockerfile: infrastructure/container/Dockerfile
      target: runtime
    image: weather:latest
    container_name: weather-prod
    volumes:
      - ./data:/data
    environment:
      PYTHONPATH: /app/src
      WEATHER_DATA_DIR: /data
      COSMO_WORK_DIR: /data/cosmo_rea6
      HDF5_USE_FILE_LOCKING: "FALSE"
    working_dir: /data
    command: python -m weather run --provider cosmo-rea6 --months 1

  weather-test:
    build:
      context: .
      dockerfile: infrastructure/container/Dockerfile
      target: development
    image: weather:test
    container_name: weather-test
    volumes:
      - ./src:/app/src
      - ./data:/data
      - ./scripts:/app/scripts
    environment:
      PYTHONPATH: /app/src
      WEATHER_DATA_DIR: /data
      COSMO_WORK_DIR: /data/cosmo_rea6
      HDF5_USE_FILE_LOCKING: "FALSE"
    working_dir: /app
    command: pytest -v src/weather/tests/
